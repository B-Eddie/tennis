<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneSaber - Controller</title>
    <link rel="stylesheet" href="/src/phone.css" />
    <link rel="icon" href="/assets/favicon.png" />
  </head>
  <body>
    <div id="permissionModal" class="modal hidden">
      <div class="modal-card">
        <h2>Enable Motion Access?</h2>
        <p>
          This game needs motion/orientation sensors to connect your phone to the game.
        </p>
        <div class="modal-actions">
          <button id="enableSensorsBtn">Enable Now</button>
          <button id="maybeLaterBtn" class="secondary">Maybe Later</button>
        </div>
      </div>
    </div>
    <main id="app">
      <h1>Phone Controller</h1>
      <p id="sessionInfo"></p>
      <br>
      <button id="connectBtn">Connect</button>
      <p id="status">Not connected</p>
      <p id="instructions"></p>
      <pre id="stats"></pre> <!-- hidden for now -->
    </main>
    <script type="module" src="/src/phone.js"></script>
  </body>
</html>
