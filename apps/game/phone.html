<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Tennis - Controller</title>
    <link rel="stylesheet" href="/src/phone.css" />
  </head>
  <body>
    <div id="permissionModal" class="modal hidden">
      <div class="modal-card">
        <h2>Enable Motion Access?</h2>
        <p>This game needs motion/orientation sensors to use your phone as a racket.</p>
        <div class="modal-actions">
          <button id="enableSensorsBtn">Enable Now</button>
          <button id="maybeLaterBtn" class="secondary">Maybe Later</button>
        </div>
      </div>
    </div>
    <main id="app">
      <h1>Phone Controller</h1>
      <p>Scan the QR from the game screen to land here. Then grant sensor permissions and swing your phone like a racket.</p>
      <p id="sessionInfo"></p>
      <button id="connectBtn">Enable Sensors + Connect</button>
      <p id="status">Not connected</p>
      <pre id="stats"></pre>
    </main>
    <script type="module" src="/src/phone.js"></script>
  </body>
</html>
